# Bundled skill: security-scan (ported from upstream)

[[steps]]
tool = "file_read"
arguments = '{"path": "{file_path}"}'
output = "source_code"

[[steps]]
tool = "think"
arguments = '{"thought": "Scan for security vulnerabilities: SQL injection, XSS, command injection, hardcoded secrets, insecure crypto, path traversal, SSRF, deserialization issues: {source_code}"}'
output = "vulnerabilities"

[[steps]]
tool = "think"
arguments = '{"thought": "Generate a security report with severity ratings (critical, high, medium, low), affected lines, and remediation advice: {vulnerabilities}"}'
output = "report"
