# PSYCHO-C.A.R.L.A. — preset: chat-simple
#
# The smallest useful configuration: one agent, a handful of tools, and
# nothing else. Useful for a quick start or a low-power machine.
#
#   carla init --preset chat-simple

[preset]
name = "chat-simple"
description = "The smallest useful configuration — one agent, few tools"

[server]
host = "127.0.0.1"
port = 8787
require_auth = false

[memory]
enabled = true
recall_limit = 5

[telemetry]
enabled = false

[voice]
enabled = false

[agents]
default = "orchestrator"

[agents.chat]
type = "orchestrator"
max_turns = 8
temperature = 0.7
tools = ["memory_search", "file_read"]
